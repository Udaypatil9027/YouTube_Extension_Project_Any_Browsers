<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 280px; 
      text-align: center; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    h3 { 
      margin-bottom: 12px; 
      font-size: 20px; 
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      letter-spacing: 1px;
    }
    button { 
      margin: 10px 0; 
      padding: 12px 25px; 
      width: 100%; 
      font-size: 15px; 
      cursor: pointer; 
      border: none;
      border-radius: 25px; 
      font-weight: bold;
      transition: all 0.3s; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      outline: none;
    }
    button:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 12px rgba(0,0,0,0.2); 
    }
    button:active {
      transform: translateY(0);
    }
    .on { 
      background: #4CAF50; 
      color: white; 
    }
    .off { 
      background: rgba(255,255,255,0.9); 
      color: #333; 
    }
    #status { 
      font-size: 13px; 
      margin-top: 8px; 
      min-height: 20px;
      font-weight: 500;
    }
    .instructions {
      font-size: 12px; 
      margin-top: 12px;
      text-align: left; 
      background: rgba(255,255,255,0.15);
      padding: 14px; 
      border-radius: 12px; 
      line-height: 1.9;
      backdrop-filter: blur(10px);
    }
    .instructions div {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .gesture-icon {
      font-size: 18px;
      width: 28px;
      text-align: center;
      display: inline-block;
    }
    .divider {
      margin: 8px 0;
      border-top: 1px solid rgba(255,255,255,0.3);
      padding-top: 8px;
    }
    .note {
      font-size: 10px; 
      margin-top: 10px;
      opacity: 0.75; 
      font-style: italic;
    }
    .feature-tag {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <h3>GestureTube</h3>
  <button id="toggleBtn">Enable Gestures</button>
  <div id="status"></div>
  
  <div class="instructions">
    <div>
      <span class="gesture-icon">✌️</span>
      <strong>Peace Sign</strong> → Play/Pause
    </div>
    <div>
      <span class="gesture-icon">🖐️</span>
      <strong>Open Palm</strong> → Skip Ad
    </div>
    <div class="divider">
      <span style="font-size: 14px;">🛡️</span>
      <strong>Auto Ad Blocker</strong>
      <span class="feature-tag">Active</span>
    </div>
  </div>
  
  <div class="note">
    Hold gesture for 0.5 seconds to trigger<br>
    Works best in good lighting
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
